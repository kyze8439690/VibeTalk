name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 1.0.1）"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装构建依赖
        run: brew install cmake ninja

      - name: 导入签名证书
        env:
          CERT_P12_BASE64: ${{ secrets.VIBETALK_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.VIBETALK_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import signing.p12 -k build.keychain -P "$CERT_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm signing.p12

      - name: 确定版本号
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译 whisper.cpp 静态库
        run: ./scripts/build_vendor.sh

      - name: 打包并签名（正式版）
        run: ./scripts/package_app.sh --release --version "${{ steps.ver.outputs.version }}"

      - name: 压缩产物
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent VibeTalk.app "VibeTalk-${{ steps.ver.outputs.version }}-macos.zip"
          shasum -a 256 VibeTalk-*.zip > SHA256SUMS.txt

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTalk-macos
          path: |
            build/VibeTalk-*.zip
            build/SHA256SUMS.txt

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VibeTalk-*.zip
            build/SHA256SUMS.txt
